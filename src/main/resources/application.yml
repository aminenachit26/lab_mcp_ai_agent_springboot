github:
  owner: ${GITHUB_OWNER:owner}
  repo: ${GITHUB_REPO:repo}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:dummy-api-key}
  model: claude-opus-4-20250514
  max-tokens: 800
  timeout-seconds: 60

mcp:
  base-url: ${MCP_BASE_URL:http://localhost:3333}
  path: ${MCP_PATH:/mcp}

spring:
  jackson:
    serialization:
      write-dates-as-timestamps: false
